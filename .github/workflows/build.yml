name: Build Fire TV APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Un seul numéro pour tout : l'appli et le nom de la version publiée
      - name: Calculer le numéro de version
        run: echo "FALKEN_BUILD=$(( ${{ github.run_number }} + 16 ))" >> $GITHUB_ENV

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Compiler l'application (version perso, tout débloqué)
        run: gradle assemblePersoRelease --stacktrace

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/perso/release/app-perso-release.apk Falken-IPTV.apk

      # Version Amazon Appstore avec Premium : n'empêche jamais la version perso d'être publiée
      - name: Compiler la version boutique (Premium)
        id: store
        continue-on-error: true
        run: |
          gradle assembleStoreRelease --stacktrace
          cp app/build/outputs/apk/store/release/app-store-release.apk Falken-IPTV-Store.apk

      - name: Mettre la version boutique à disposition (onglet Actions)
        if: steps.store.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Falken-IPTV-Store-apk
          path: Falken-IPTV-Store.apk

      - name: Mettre l'APK à disposition (onglet Actions)
        uses: actions/upload-artifact@v4
        with:
          name: Falken-IPTV-apk
          path: Falken-IPTV.apk

      # Sans fichier de nouveautés, la publication échouait et l'appli ne voyait pas la mise à jour
      - name: Préparer les nouveautés
        run: |
          if [ ! -s NOUVEAUTES.txt ]; then
            git log -1 --pretty=%s > NOUVEAUTES.txt
          fi

      - name: Publier l'APK (lien de téléchargement direct pour le Fire Stick)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.FALKEN_BUILD }}
          name: Falken IPTV ${{ env.FALKEN_BUILD }}
          files: Falken-IPTV.apk
          make_latest: true
          # Nouveautés affichées dans l'appli au moment de la mise à jour
          body_path: NOUVEAUTES.txt
